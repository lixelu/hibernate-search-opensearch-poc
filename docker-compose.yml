# Local stack for the reference implementation.
#
#   docker compose up -d mysql opensearch     # infrastructure only, run the app from your IDE
#   docker compose --profile app up -d --build  # everything, including the service
#   docker compose --profile tools up -d dashboards   # OpenSearch Dashboards on :5601
name: catalog-opensearch-demo

services:
  mysql:
    image: mysql:8.4
    container_name: catalog-mysql
    command:
      - --innodb-buffer-pool-size=1G
      - --max-connections=300
      # The point of the demo is join cost, not disk sync cost. Do NOT copy this
      # to anything that holds real data.
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucatalog", "-pcatalog"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    container_name: catalog-opensearch
    environment:
      - cluster.name=catalog
      - node.name=catalog-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Local only. A real cluster runs with the security plugin on, TLS, and a
      # dedicated service account for the application.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6
    container_name: catalog-dashboards
    profiles: ["tools"]
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  app:
    build: ./app
    container_name: catalog-app
    profiles: ["app"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
      CATALOG_SEARCH_OPENSEARCH_URI: http://opensearch:9200
      CATALOG_SEARCH_ENGINE: OPENSEARCH
      CATALOG_DEMO_PRODUCTS: "20000"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Observability, opt-in:  docker compose --profile observability up -d
  # Grafana on :3000 (anonymous, no login), Prometheus on :9090.
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: catalog-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    container_name: catalog-grafana
    profiles: ["observability"]
    environment:
      # A local demo dashboard, not an exposed service: skip the login wall.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  opensearch-data:
